<!-- ================= SCREEN 7: LIVE INTERACTIVE MODE (คุยสดผ่านกล้อง) ================= -->
<div id="screen-live" class="screen-view bg-black justify-between text-white relative h-full">
    <!-- Camera Video Feed & Sci-fi HUD -->
    <div class="absolute inset-0 w-full h-full overflow-hidden bg-slate-950 flex items-center justify-center">
        <video id="liveVideoFeed" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="liveCanvasCapture" class="hidden"></canvas>
        
        <!-- Futuristic AR Reticles -->
        <div class="absolute inset-4 border border-cyan-500/20 rounded-3xl pointer-events-none flex flex-col justify-between p-4">
            <div class="flex flex-wrap justify-between items-start gap-2">
                <div class="w-8 h-8 border-t-2 border-l-2 border-cyan-400"></div>
                <div class="flex flex-wrap items-center justify-center gap-2">
                    <div class="flex items-center gap-1.5 bg-black/75 backdrop-blur-md px-3 py-1 rounded-full border border-cyan-500/40 text-[11px] text-cyan-300 font-bold shadow">
                        <i class="fa-solid fa-eye text-cyan-400"></i> GEMINI 3.8 LIVE VISION
                    </div>
                    <!-- Integrated IoT Sensor & Presence Detection HUD Badge -->
                    <div id="liveSensorHudBadge" class="flex items-center gap-1.5 bg-slate-950/85 backdrop-blur-md px-3 py-1 rounded-full border border-emerald-500/40 text-[10px] text-emerald-300 font-mono-code shadow">
                        <span id="liveSensorHudPulse" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span id="liveSensorHudText">📡 Sensor HC-SR04 + AI Presence: สแตนด์บาย</span>
                    </div>
                </div>
                <div class="w-8 h-8 border-t-2 border-r-2 border-cyan-400"></div>
            </div>
            <div class="flex justify-between items-end">
                <div class="w-8 h-8 border-b-2 border-l-2 border-cyan-400"></div>
                <div id="liveFpsBadge" class="text-xs text-slate-400 font-mono-code">1.0 FPS • PCM 24k Low Latency</div>
                <div class="w-8 h-8 border-b-2 border-r-2 border-cyan-400"></div>
            </div>
        </div>

        <!-- Scanning Beam -->
        <div id="liveScanningBeam" class="hidden absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_20px_rgba(6,182,212,0.9)] animate-pulse pointer-events-none"></div>
    </div>

    <!-- Top Overlay Controls -->
    <div class="relative z-20 bg-gradient-to-b from-black/85 via-black/40 to-transparent p-4 flex items-center justify-between">
        <button onclick="stopLiveSession(); navigateTo('screen-welcome')" class="w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 backdrop-blur-md flex items-center justify-center text-white border border-white/20 transition active:scale-95 shadow">
            <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        
        <div class="flex items-center gap-2 bg-black/70 backdrop-blur-md px-4 py-1.5 rounded-full border border-rose-500/30">
            <span id="liveStatusPulse" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
            <span id="liveStatusLabel" class="font-black text-xs text-white tracking-wider uppercase">OFFLINE</span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="flipLiveCamera()" class="w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 backdrop-blur-md flex items-center justify-center text-white border border-white/20 transition active:scale-95 shadow" title="สลับกล้อง">
                <i class="fa-solid fa-camera-rotate text-sm text-slate-200"></i>
            </button>
            <button id="liveMuteToggleBtn" onclick="toggleLiveMicMute()" class="w-10 h-10 rounded-full bg-black/60 hover:bg-black/80 backdrop-blur-md flex items-center justify-center text-white border border-white/20 transition active:scale-95 shadow" title="เปิด/ปิดไมค์">
                <i id="liveMuteIcon" class="fa-solid fa-microphone text-sm text-emerald-400"></i>
            </button>
        </div>
    </div>

    <!-- Middle Mascot State & Voice Waves -->
    <div class="relative z-10 my-auto flex flex-col items-center justify-center pointer-events-none px-4">
        <div id="liveMascotOrb" class="w-24 h-24 rounded-3xl overflow-hidden ring-4 ring-cyan-400/40 bg-slate-900 flex items-center justify-center shadow-[0_0_35px_rgba(6,182,212,0.45)] transition-all duration-300">
            <img src="{{ url_for('static', filename='img/mascot.jpg') }}" alt="Mascot" class="w-full h-full object-cover">
        </div>
        <div id="liveVoiceWaves" class="hidden items-center gap-1.5 mt-3">
            <span class="w-1.5 h-4 bg-cyan-400 rounded-full animate-pulse"></span>
            <span class="w-1.5 h-6 bg-rose-400 rounded-full animate-pulse" style="animation-delay: 0.15s;"></span>
            <span class="w-1.5 h-5 bg-amber-400 rounded-full animate-pulse" style="animation-delay: 0.3s;"></span>
            <span class="w-1.5 h-7 bg-emerald-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></span>
            <span class="w-1.5 h-4 bg-purple-400 rounded-full animate-pulse" style="animation-delay: 0.1s;"></span>
        </div>
        <span id="liveStateBadge" class="mt-3 text-xs font-bold px-4 py-1.5 rounded-full bg-slate-900/85 backdrop-blur-md border border-cyan-400/30 text-cyan-300 shadow">
            กดปุ่มด้านล่างเพื่อเริ่มการสนทนาสด
        </span>
    </div>

    <!-- Bottom Subtitles & Control Panel -->
    <div class="relative z-20 bg-gradient-to-t from-black/95 via-black/85 to-transparent p-4 md:p-6 flex flex-col gap-3 max-w-3xl mx-auto w-full">
        <!-- Live Subtitles Glass Box -->
        <div id="liveSubtitleBox" class="glass-card rounded-2xl p-4 border border-white/20 min-h-[76px] max-h-32 overflow-y-auto custom-scrollbar flex flex-col justify-end text-xs leading-relaxed">
            <div id="liveUserSubWrapper" class="text-slate-300 text-xs font-medium hidden">
                <span class="text-cyan-400 font-bold">👤 คุณ:</span> <span id="liveUserSubText">...</span>
            </div>
            <div id="liveAISubWrapper" class="text-white font-semibold mt-1">
                <span class="text-rose-400 font-black">🤖 น้องเพชร:</span> <span id="liveAISubText">สวัสดีครับ! กด "เริ่มการสนทนาสด" แล้วส่องกล้องคุยกับผมได้เลยครับ</span>
            </div>
        </div>

        <!-- Main Action Button -->
        <div class="flex items-center gap-2">
            <button id="btnToggleLiveSession" onclick="toggleLiveSession()" class="flex-1 py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-rose-700 hover:from-rose-500 hover:to-pink-500 text-white font-black text-sm rounded-2xl shadow-[0_8px_25px_rgba(225,29,72,0.5)] border border-white/30 active:scale-95 transition flex items-center justify-center gap-2.5">
                <i id="btnToggleLiveIcon" class="fa-solid fa-play text-xs"></i>
                <span id="btnToggleLiveLabel">เริ่มการสนทนาสด (Start Live Session)</span>
            </button>
        </div>
    </div>
</div>
