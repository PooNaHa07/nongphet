<!DOCTYPE html>
<html lang="th" class="h-full bg-black select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>น้องเพชร - Emotion Display (จอแสดงอารมณ์ส่วนหัว)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/static/img/robot.svg">
    <!-- Google MediaPipe Hands & Camera Utils for Sign Language Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/emotion.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
            background: #020617;
        }
    </style>
</head>
<body class="h-full w-full flex items-center justify-center p-0 m-0 bg-black cursor-default select-none" id="emotionBody">

    <!-- Robot Visor Screen Container -->
    <div class="robot-face-stage relative w-full h-full flex flex-col items-center justify-center overflow-hidden">
        
        <!-- Ambient Cyber Glow Backdrop & Orbital HUD Rings -->
        <div class="ambient-glow absolute inset-0 pointer-events-none"></div>
        <div class="orbital-ring ring-outer absolute pointer-events-none"></div>
        <div class="orbital-ring ring-inner absolute pointer-events-none"></div>
        <div class="scanner-sweep-line" id="scannerSweepLine"></div>

        <!-- Floating Emotion Particle Layer (Hearts, Stars, Cyber Sparkles) -->
        <div id="emotionParticleLayer" class="absolute inset-0 pointer-events-none z-30 overflow-hidden"></div>

        <!-- Cyber Ear Fins (Left & Right) - Interactive with cute wiggle reactions -->
        <div class="cyber-ear ear-left absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 flex flex-col gap-1.5 z-30 cursor-pointer pointer-events-auto" onclick="triggerEarReaction('left', event)" title="แตะหูซ้ายน้องเพชรเพื่อเกาคันๆ">
            <span class="ear-segment"></span>
            <span class="ear-segment"></span>
            <span class="ear-segment active"></span>
            <span class="ear-segment"></span>
            <span class="ear-segment"></span>
        </div>
        <div class="cyber-ear ear-right absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 flex flex-col gap-1.5 z-30 cursor-pointer pointer-events-auto" onclick="triggerEarReaction('right', event)" title="แตะหูขวาน้องเพชรเพื่อเกาคันๆ">
            <span class="ear-segment"></span>
            <span class="ear-segment"></span>
            <span class="ear-segment active"></span>
            <span class="ear-segment"></span>
            <span class="ear-segment"></span>
        </div>

        <!-- Sci-Fi Corner Telemetry Brackets -->
        <div class="hud-corner hud-top-left absolute top-3 left-3 text-[10px] font-mono text-cyan-400/60 pointer-events-none select-none hidden sm:flex flex-col gap-0.5 z-30">
            <span class="tracking-wider">◤ PBVC // ROBOTICS AI</span>
            <span class="text-cyan-500/40 text-[9px]">SYS: NONGPHET_v2.5</span>
        </div>
        <div class="hud-corner hud-top-right absolute top-3 right-3 text-[10px] font-mono text-cyan-400/60 pointer-events-none select-none hidden sm:flex flex-col items-end gap-0.5 z-30">
            <span class="tracking-wider" id="hudClock">15:16:00 ◥</span>
            <span class="text-cyan-500/40 text-[9px]">CORE: ONLINE (60 FPS)</span>
        </div>
        <div class="hud-corner hud-bottom-left absolute bottom-3 left-3 text-[10px] font-mono text-cyan-400/60 pointer-events-none select-none hidden sm:flex flex-col gap-0.5 z-30">
            <span class="tracking-wider">◣ AUDIO DUAL-BUS</span>
            <span class="text-cyan-500/40 text-[9px]">LIP-SYNC: ACTIVE</span>
        </div>

        <!-- Face Canvas & Vector Elements -->
        <div class="face-container relative flex flex-col items-center justify-center z-10 transition-transform duration-300">
            
            <!-- Eyes & Eyebrows Section -->
            <div class="eyes-row flex items-center justify-center gap-10 sm:gap-14 md:gap-20 relative">
                
                <!-- Left Eye Wrapper -->
                <div class="eye-wrapper relative" id="leftEyeWrapper">
                    <!-- Left Cyber Eyebrow -->
                    <div class="cyber-brow left-brow" id="leftBrow"></div>
                    <div class="cyber-eye left-eye" id="leftEye" onclick="triggerWinkReaction(event)">
                        <!-- Blueprint Shape 1: Arc Curve (⌒) -->
                        <svg class="eye-shape-svg eye-shape-arc" viewBox="0 0 100 80">
                            <path d="M 14 62 Q 50 14 86 62" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
                        </svg>

                        <!-- Blueprint Shape 2: Squint Chevron (>) -->
                        <svg class="eye-shape-svg eye-shape-squint" viewBox="0 0 100 80">
                            <path d="M 22 18 L 82 40 L 22 62" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                        <!-- Blueprint Shape 3: Sparkling Star (✦) -->
                        <div class="eye-shape-stars">
                            <svg class="eye-star-svg" viewBox="0 0 100 100">
                                <path d="M 50 0 Q 50 50 100 50 Q 50 50 50 100 Q 50 50 0 50 Q 50 50 50 0 Z" fill="currentColor"/>
                            </svg>
                        </div>

                        <!-- Standard Pupil & Target Rings for Normal / Surprised / Laser -->
                        <div class="eye-pupil">
                            <div class="eye-heart">💖</div>
                            <div class="pupil-target-ring"></div>
                        </div>
                        <div class="eye-glint"></div>
                        <div class="eye-glint-star">✦</div>
                    </div>
                    <!-- Rosy Cheek Left with 3 Kawaii Angled Slashes (\\\ in poster) -->
                    <div class="cheek cheek-left" id="cheekLeft" onclick="triggerShyReaction(event)" title="แตะแก้มเพื่อให้น้องเพชรเขิน">
                        <div class="blush-slashes blush-left">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>

                <!-- Center Nose / Forehead Sensor (Click to trigger Head Pet / Blissful Purr) -->
                <div class="face-center-sensor" id="foreheadSensor" onclick="triggerHeadPet(event)" title="แตะหรือลูบหัวน้องเพชรเพื่อแสดงความรัก (Head Pet)"></div>

                <!-- Right Eye Wrapper -->
                <div class="eye-wrapper relative" id="rightEyeWrapper">
                    <!-- Right Cyber Eyebrow -->
                    <div class="cyber-brow right-brow" id="rightBrow"></div>
                    <div class="cyber-eye right-eye" id="rightEye" onclick="triggerWinkReaction(event)">
                        <!-- Blueprint Shape 1: Arc Curve (⌒) -->
                        <svg class="eye-shape-svg eye-shape-arc" viewBox="0 0 100 80">
                            <path d="M 14 62 Q 50 14 86 62" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
                        </svg>

                        <!-- Blueprint Shape 2: Squint Chevron (<) -->
                        <svg class="eye-shape-svg eye-shape-squint" viewBox="0 0 100 80">
                            <path d="M 78 18 L 18 40 L 78 62" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                        <!-- Blueprint Shape 3: Sparkling Star (✦) -->
                        <div class="eye-shape-stars">
                            <svg class="eye-star-svg" viewBox="0 0 100 100">
                                <path d="M 50 0 Q 50 50 100 50 Q 50 50 50 100 Q 50 50 0 50 Q 50 50 50 0 Z" fill="currentColor"/>
                            </svg>
                        </div>

                        <!-- Standard Pupil & Target Rings for Normal / Surprised / Laser -->
                        <div class="eye-pupil">
                            <div class="eye-heart">💖</div>
                            <div class="pupil-target-ring"></div>
                        </div>
                        <div class="eye-glint"></div>
                        <div class="eye-glint-star">✦</div>
                    </div>
                    <!-- Rosy Cheek Right with 3 Kawaii Angled Slashes (/// in poster) -->
                    <div class="cheek cheek-right" id="cheekRight" onclick="triggerShyReaction(event)" title="แตะแก้มเพื่อให้น้องเพชรเขิน">
                        <div class="blush-slashes blush-right">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Mouth Section -->
            <div class="mouth-row mt-6 sm:mt-8 md:mt-12 flex items-center justify-center relative">
                <div class="cyber-mouth" id="cyberMouth" onclick="triggerMouthReaction(event)" title="แตะปากเพื่อคุยหรือฟังเสียงน้องเพชร"></div>
            </div>

            <!-- Cyber Audio Waveform Visualizer -->
            <div class="audio-wave-row mt-3 sm:mt-5 flex items-center justify-center gap-1.5" id="audioWaveRow">
                <span class="wave-bar bar-1"></span>
                <span class="wave-bar bar-2"></span>
                <span class="wave-bar bar-3"></span>
                <span class="wave-bar bar-4"></span>
                <span class="wave-bar bar-5"></span>
                <span class="wave-bar bar-6"></span>
                <span class="wave-bar bar-7"></span>
                <span class="wave-bar bar-8"></span>
                <span class="wave-bar bar-9"></span>
            </div>

            <!-- Floating Sleep Z Animation Particles -->
            <div class="sleep-particles" id="sleepParticles">
                <span class="sleep-z">z</span>
                <span class="sleep-z">Z</span>
                <span class="sleep-z">Z</span>
            </div>

            <!-- Emotion Label Overlay (Subtle) -->
            <div class="status-indicator mt-3 flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/40 border border-cyan-500/20 text-cyan-400 text-xs tracking-wider opacity-0 transition-opacity duration-300" id="statusBadge">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="statusText">พร้อมให้บริการ</span>
            </div>

        </div>

        <!-- Hidden Vision Elements for Motion & People Tracking -->
        <video id="trackingVideo" playsinline autoplay muted class="hidden"></video>
        <canvas id="trackingCanvas" width="160" height="120" class="hidden"></canvas>

        <!-- Camera Tracking Indicator (Top-Left) -->
        <div id="cameraStatusBadge" class="absolute top-3 left-3 sm:left-48 flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/80 border border-slate-700 text-xs text-slate-300 backdrop-blur-md opacity-40 hover:opacity-100 transition-opacity z-40 cursor-pointer" onclick="toggleCameraTracking()" title="คลิกเพื่อ เปิด/ปิด ระบบกล้องมองตามคน">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-500" id="camIndicatorDot"></span>
            <span id="camStatusText">กล้องมองตามคน: ปิด</span>
            <i class="fa-solid fa-camera text-[10px] ml-1"></i>
        </div>

        <!-- Sign Language Detection Indicator (Top-Right) -->
        <div id="signLanguageStatusBadge" class="absolute top-3 right-3 sm:right-48 flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/80 border border-cyan-500/40 text-xs text-cyan-300 backdrop-blur-md opacity-70 hover:opacity-100 transition-opacity z-40 cursor-pointer shadow-lg active:scale-95" onclick="toggleSignLanguageMode()" title="คลิกเพื่อ เปิด/ปิด ระบบตรวจจับภาษามือ (TSL)">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-500" id="signIndicatorDot"></span>
            <span id="signStatusText">ตรวจจับภาษามือ: ปิด</span>
            <i class="fa-solid fa-hands-asl-interpreting text-xs ml-0.5 text-cyan-400"></i>
        </div>

        <!-- Camera PIP Mini Preview (Toggleable) -->
        <div id="camPreviewBox" class="absolute bottom-3 left-3 w-32 h-24 rounded-xl overflow-hidden border border-cyan-500/40 shadow-2xl bg-black hidden z-40">
            <canvas id="pipCanvas" class="w-full h-full object-cover"></canvas>
            <div class="absolute bottom-1 left-1 px-1.5 py-0.5 rounded bg-black/70 text-[9px] text-cyan-300 font-mono" id="pipLabel">VISION</div>
        </div>

        <!-- Hidden Audio Player for Direct Voice Responses on Face Screen -->
        <audio id="emotionAudioPlayer" class="hidden"></audio>

        <!-- Live Voice Subtitle Bar -->
        <div id="voiceSubtitleBox" class="absolute bottom-16 sm:bottom-12 px-6 py-2.5 rounded-2xl bg-slate-900/90 border border-cyan-500/40 text-slate-100 text-xs sm:text-sm max-w-lg text-center backdrop-blur-xl shadow-2xl opacity-0 transform translate-y-3 transition-all duration-300 z-30 pointer-events-none">
            <span id="voiceSubtitleText">...</span>
        </div>

        <!-- Quick Interactive Emotion Dock (พร้อมไอคอน 4 อารมณ์หลักจากโปสเตอร์พิมพ์เขียว 1:1) -->
        <div id="quickEmotionDock" class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-950/90 backdrop-blur-xl border border-cyan-500/40 px-3 py-1.5 rounded-2xl flex items-center gap-1.5 shadow-2xl transition-all duration-300 z-50 transform translate-y-16 opacity-0 hover:translate-y-0 hover:opacity-100">
            <!-- 4 Blueprint Iconic Expressions -->
            <button onclick="setEmotionLocally('smile')" class="dock-btn text-cyan-300 font-bold" title="1. ยิ้มโค้งพิมพ์เขียว (⌒‿⌒)">⌒‿⌒</button>
            <button onclick="setEmotionLocally('squint')" class="dock-btn text-cyan-300 font-bold" title="2. ยิ้มตาหยี (>‿<)">>‿<</button>
            <button onclick="setEmotionLocally('excited')" class="dock-btn text-amber-300 font-bold" title="3. ประกายดาว (✦‿✦)">✦‿✦</button>
            <button onclick="setEmotionLocally('surprised')" class="dock-btn text-purple-300 font-bold" title="4. ตกใจ/สแกน (O‿O)">O‿O</button>
            <div class="w-px h-5 bg-cyan-500/40 mx-0.5"></div>
            <!-- Additional Robot Intelligence Modes -->
            <button onclick="setEmotionLocally('idle')" class="dock-btn" title="ปกติ (Idle)">😊</button>
            <button onclick="setEmotionLocally('listening')" class="dock-btn" title="ฟัง (Listening)">👂</button>
            <button onclick="setEmotionLocally('thinking')" class="dock-btn" title="คิดวิเคราะห์ (Thinking)">🤔</button>
            <button onclick="setEmotionLocally('speaking')" class="dock-btn" title="พูดคุย (Speaking)">🗣️</button>
            <button onclick="setEmotionLocally('love')" class="dock-btn" title="เขิน/หัวใจ (Love)">💖</button>
            <button onclick="setEmotionLocally('scanner')" class="dock-btn" title="สแกนเนอร์ (Scanner)">⚡</button>
            <button onclick="setEmotionLocally('wink')" class="dock-btn" title="ขยิบตา (Wink)">😉</button>
            <button onclick="setEmotionLocally('sleeping')" class="dock-btn" title="พักเครื่อง (Sleeping)">💤</button>
            <div class="w-px h-5 bg-cyan-500/30 mx-0.5"></div>
            <button onclick="toggleSignLanguageMode()" class="dock-btn text-cyan-300 text-sm" id="btnDockSign" title="เปิด/ปิด ตรวจจับภาษามือ (หรือกด S)">🤟</button>
            <button onclick="cycleTheme()" class="dock-btn text-amber-300 text-sm" id="btnCycleTheme" title="สลับธีมสี (หรือกด T)">🎨</button>
            <button onclick="toggleSfx()" class="dock-btn text-cyan-300 text-xs" id="btnToggleSfx" title="เปิด/ปิด เสียงเอฟเฟกต์หุ่นยนต์ (หรือกด M)"><i class="fa-solid fa-volume-high"></i></button>
        </div>

        <!-- Dock Toggle Button & Mic Button -->
        <button id="btnToggleDock" onclick="toggleEmotionDock()" class="absolute bottom-4 left-4 w-10 h-10 rounded-xl bg-slate-900/80 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 text-sm flex items-center justify-center transition-all shadow-lg active:scale-95 z-40" title="เปิด/ปิด แถบเลือกอารมณ์ด่วน (หรือกด E)">
            <i class="fa-solid fa-face-smile"></i>
        </button>

        <!-- Voice Chat Floating Button (Click to talk to Nong Phet directly) -->
        <button id="btnEmotionVoice" onclick="toggleDirectVoice()" class="absolute bottom-4 right-4 sm:bottom-6 sm:right-6 w-12 h-12 rounded-2xl bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 flex items-center justify-center text-cyan-300 text-lg shadow-2xl shadow-cyan-500/30 backdrop-blur-md transition-all active:scale-95 z-40" title="แตะเพื่อคุยด้วยเสียงกับน้องเพชรโดยตรง (หรือกด Spacebar)">
            <i class="fa-solid fa-microphone" id="emotionMicIcon"></i>
        </button>

        <!-- Hidden Demo Toolbar (Hover on top-right or press 'T' to toggle) -->
        <div id="demoControls" class="absolute top-2 right-2 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 p-2 rounded-xl flex flex-wrap gap-1 text-[11px] opacity-0 hover:opacity-100 transition-opacity z-50 shadow-2xl max-w-md">
            <button onclick="setEmotionLocally('smile')" class="px-2 py-1 bg-cyan-800 hover:bg-cyan-600 text-white rounded font-bold">⌒‿⌒ ยิ้มโค้ง</button>
            <button onclick="setEmotionLocally('squint')" class="px-2 py-1 bg-cyan-800 hover:bg-cyan-600 text-white rounded font-bold">>‿< ตาหยี</button>
            <button onclick="setEmotionLocally('excited')" class="px-2 py-1 bg-amber-800 hover:bg-amber-600 text-white rounded font-bold">✦‿✦ ดาว</button>
            <button onclick="setEmotionLocally('surprised')" class="px-2 py-1 bg-purple-800 hover:bg-purple-600 text-white rounded font-bold">O‿O ตกใจ</button>
            <button onclick="setEmotionLocally('idle')" class="px-2 py-1 bg-slate-800 hover:bg-cyan-600 text-white rounded">😊 ว่าง</button>
            <button onclick="setEmotionLocally('listening')" class="px-2 py-1 bg-slate-800 hover:bg-emerald-600 text-white rounded">👂 ฟัง</button>
            <button onclick="setEmotionLocally('thinking')" class="px-2 py-1 bg-slate-800 hover:bg-amber-600 text-white rounded">🤔 คิด</button>
            <button onclick="setEmotionLocally('speaking')" class="px-2 py-1 bg-slate-800 hover:bg-blue-600 text-white rounded">🗣️ พูด</button>
            <button onclick="setEmotionLocally('love')" class="px-2 py-1 bg-slate-800 hover:bg-rose-600 text-white rounded">💖 เขิน</button>
            <button onclick="setEmotionLocally('scanner')" class="px-2 py-1 bg-slate-800 hover:bg-cyan-500 text-white rounded">⚡ สแกน</button>
            <button onclick="setEmotionLocally('sleeping')" class="px-2 py-1 bg-slate-800 hover:bg-indigo-600 text-white rounded">💤 หลับ</button>
            <button onclick="toggleSignLanguageMode()" id="btnToggleSign" class="px-2 py-1 bg-cyan-700 hover:bg-cyan-600 text-white rounded font-bold"><i class="fa-solid fa-hands-asl-interpreting"></i> ตรวจจับภาษามือ</button>
            <button onclick="toggleCameraTracking()" id="btnToggleCam" class="px-2 py-1 bg-emerald-800 hover:bg-emerald-700 text-white rounded font-bold"><i class="fa-solid fa-video"></i> เปิดกล้องตามคน</button>
            <button onclick="togglePipPreview()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded">🖼️ สลับจอเล็ก</button>
            <button onclick="toggleFullscreen()" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-white rounded"><i class="fa-solid fa-expand"></i> เต็มจอ</button>
        </div>

    </div>

    <script src="/static/js/emotion.js"></script>
</body>
</html>
